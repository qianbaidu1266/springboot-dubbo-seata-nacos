server:
  port: 8104

spring:
  application:
    name: dubbo-business-example
#====================================Dubbo config===============================================
dubbo:
  application:
    id: dubbo-business-example
    name: dubbo-business-example
    qosEnable: false
    metadata-type: remote
  protocol:
    id: dubbo
    name: dubbo
    port: 10001
  registry:
    id: dubbo-business-example-registry
    address: nacos://127.0.0.1:8848
  config-center:
    address: nacos://127.0.0.1:8848
  metadata-report:
    address: nacos://127.0.0.1:8848
  # ---- tag 隔离：本环境实例统一打同一个 tag，避免与不同 tag 的服务互相干扰 ----
  # provider.tag -> provider URL 的 dubbo.tag 参数；consumer.tag -> consumer URL 的 dubbo.tag
  # 注意：两者必须成对配置，否则未打标的一方看不到已打标的提供者（No provider available）
  provider:
    tag: dev
  consumer:
    tag: dev
    timeout: 600000
    retries: 0
    parameters:
      # 找不到同 tag 的提供者时直接失败，不回退到未打标的实例（严格隔离）
      # ⚠️ 必须写「点号」形式：Spring 惯用的 "[dubbo.force.tag]" 方括号写法在 Dubbo 3 里绑不进去
      #    （parameters 定义在 AbstractMethodConfig 上，Dubbo 自己的绑定器不展开方括号 key），
      #    实测只有点号形式才会落到消费端 URL 的 dubbo.force.tag 参数上。
      dubbo.force.tag: "true"
#====================================Seata Config===============================================
seata:
  enabled: true
  application-id: business-seata-example
  tx-service-group: business-service-seata-service-group # 事务群组（可以每个应用独立取名，也可以使用相同的名字）
  registry:
    type: nacos
    nacos:
      server-addr: localhost:8848
      namespace: ""
      cluster: default
      group: SEATA_GROUP
  config:
    type: nacos
    nacos:
      namespace: ""
      server-addr: localhost:8848
      group: SEATA_GROUP